<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>페이지를 찾을 수 없습니다 | 기술지표분석교실</title>
    <meta name="description" content="요청한 페이지를 찾을 수 없습니다. 기술지표분석교실 학습 홈이나 종목 분석으로 이동하세요.">
    <style>
      :root { color-scheme: light; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #101820; background: #eef2f4; }
      * { box-sizing: border-box; }
      body { margin: 0; min-width: 320px; }
      main { display: grid; min-height: 100dvh; place-items: center; padding: 24px max(18px, env(safe-area-inset-left)) max(24px, env(safe-area-inset-bottom)); }
      section { display: grid; width: min(100%, 520px); gap: 14px; border: 1px solid #d3dde2; border-radius: 20px; background: #fff; padding: clamp(24px, 7vw, 42px); box-shadow: 0 18px 48px rgba(15, 23, 42, .10); }
      .eyebrow { margin: 0; color: #0f7f7a; font-size: .78rem; font-weight: 850; letter-spacing: .08em; }
      h1 { margin: 0; font-size: clamp(1.7rem, 8vw, 2.5rem); line-height: 1.1; }
      p { margin: 0; color: #51636e; line-height: 1.7; }
      nav { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 4px; }
      a { display: inline-flex; min-height: 44px; align-items: center; justify-content: center; border: 1px solid #0f7f7a; border-radius: 10px; padding: 9px 14px; color: #0f6965; font-weight: 800; text-decoration: none; }
      a:first-child { background: #0f7f7a; color: #fff; }
      @media (max-width: 420px) { nav { display: grid; } a { width: 100%; } }
    </style>
  </head>
  <body>
    <main>
      <section>
        <p class="eyebrow">망치든개발자의 기술지표분석교실</p>
        <h1>페이지를 찾을 수 없습니다.</h1>
        <p>주소가 바뀌었거나 아직 준비되지 않은 페이지입니다. 학습 홈에서 지표를 살펴보거나 종목 분석으로 이동해 주세요.</p>
        <nav aria-label="페이지 이동">
          <a href="/">학습 홈으로</a>
          <a href="/analysis">종목 분석으로</a>
        </nav>
      </section>
    </main>
  </body>
</html>
